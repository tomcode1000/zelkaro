name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: tests (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zelkaro has zero runtime dependencies, so there is nothing to install.
      - name: Run tests
        run: node --test
      - name: Verify the test-summary badge is in sync
        if: matrix.node == 20
        run: node scripts/test-summary.mjs
