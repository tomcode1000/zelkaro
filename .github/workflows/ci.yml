name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: tests (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zelkaro has zero runtime dependencies, so there is nothing to install.
      - name: Run tests
        run: node --test

  summary:
    runs-on: ubuntu-latest
    needs: test
    name: test summary badge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate test-summary.json
        run: node scripts/test-summary.mjs
      - name: Commit the badge summary if it changed
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet docs/assets/test-summary.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/assets/test-summary.json
            git commit -m "ci: update test-summary badge [skip ci]"
            git push
          fi
